# Prefix: C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Terminal
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",alacritty:RGB,ghostty:RGB"

# General
set -g mode-keys vi
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on

# Vi copy mode
bind -T copy-mode-vi v send-keys -X begin-selection

# Pane borders
set -g pane-border-status top
set -g pane-border-format "#{pane_title}"

# OneDark theme (verbatim from odedlaz/tmux-onedark-theme)
set -g @onedark_time_format "%I:%M %p"
set -g @onedark_date_format "%D"
run-shell '~/.config/tmux/onedark-theme.tmux'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Claude Code session persistence (layered on resurrect/continuum).
# Snapshot every Claude pane's exact session id in lockstep with each resurrect
# save, then re-resume them after continuum rebuilds the layout on boot.
set -g @resurrect-hook-post-save-all    '/opt/homebrew/bin/python3 /Users/jesse/.config/tmux/claude-sessions.py snapshot >> /Users/jesse/.config/tmux/claude-sessions/hook.log 2>&1'
set -g @resurrect-hook-post-restore-all '/opt/homebrew/bin/python3 /Users/jesse/.config/tmux/claude-sessions.py restore >> /Users/jesse/.config/tmux/claude-sessions/hook.log 2>&1'
# Manual snapshot on demand: prefix + S
bind S run-shell '/opt/homebrew/bin/python3 /Users/jesse/.config/tmux/claude-sessions.py snapshot'

# Initialize TPM (keep at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
